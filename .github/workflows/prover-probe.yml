name: prover-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: does the Stwo prover start on this x86-64 runner (avx2, no avx512)?
        run: |
          echo "arch: $(uname -m) | avx512f: $(grep -qo avx512f /proc/cpuinfo && echo YES || echo NO) | avx2: $(grep -qo avx2 /proc/cpuinfo && echo YES || echo NO)"
          docker run -d --name prv -p 3000:3000 \
            -v "$PWD/strk20-integration/sepolia/prover-config.sepolia.json:/config.json:ro" \
            ghcr.io/starkware-libs/starknet-privacy/transaction-prover:PRIVACY-0.14.3-RC.2 --config_file /config.json
          sleep 18
          echo "=== container status ==="
          docker ps -a --filter name=prv --format '{{.Status}}'
          echo "=== logs ==="
          docker logs prv 2>&1 | head -30
          echo "=== rpc probe ==="
          curl -s -o /dev/null -w "http %{http_code}\n" --max-time 10 -X POST http://localhost:3000/ -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"starknet_proveTransaction","params":[]}' || echo "no rpc"
