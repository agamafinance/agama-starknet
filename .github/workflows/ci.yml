name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Scarb
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.20.0"

      - name: Set up Starknet Foundry
        uses: foundry-rs/setup-snforge@v3
        with:
          starknet-foundry-version: "0.62.1"

      - name: Check formatting
        run: scarb fmt --check

      - name: Build
        run: scarb build

      - name: Run tests
        run: snforge test
